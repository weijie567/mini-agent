[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "mini-agent"
version = "0.1.0"
description = "P0 consumer order and delivery after-sales agent"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "pytest-xdist>=3.6,<4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mini_agent"]

[tool.pytest.ini_options]
addopts = ["-ra", "-m", "not qwen_baseline"]
testpaths = ["tests"]
markers = [
  "qwen_baseline: requires explicit Qwen credentials and external network access",
]
