services:
  db:
    image: pgvector/pgvector:0.8.2-pg16
    environment:
      POSTGRES_DB: ${MINI_AGENT_POSTGRES_DB:-mini_agent}
      POSTGRES_USER: ${MINI_AGENT_POSTGRES_USER:-mini_agent}
      POSTGRES_PASSWORD: ${MINI_AGENT_POSTGRES_PASSWORD:-mini_agent_local_only}
    ports:
      - "${MINI_AGENT_DB_PORT:-55432}:5432"
    volumes:
      - mini_agent_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  db-test:
    image: pgvector/pgvector:0.8.2-pg16
    profiles: ["test"]
    environment:
      POSTGRES_DB: ${MINI_AGENT_TEST_POSTGRES_DB:-mini_agent_test}
      POSTGRES_USER: ${MINI_AGENT_POSTGRES_USER:-mini_agent}
      POSTGRES_PASSWORD: ${MINI_AGENT_POSTGRES_PASSWORD:-mini_agent_local_only}
    ports:
      - "${MINI_AGENT_TEST_DB_PORT:-55433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\"",
        ]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  mini_agent_db_data:
